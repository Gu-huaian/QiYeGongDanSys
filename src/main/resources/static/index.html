<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>企业工单管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.9.1/dist/index.css">
    <link rel="stylesheet" href="https://unpkg.com/@fontsource/icon/index.css">
    <style>
        :root {
            --sidebar-width: 220px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f0f2f5; }
        #app { max-width: 1440px; margin: 0 auto; }

        /* 登录页 */
        .login-wrapper {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 20px;
        }
        .login-card {
            width: 100%; max-width: 420px; padding: 40px 36px; border-radius: 12px;
            background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        .login-title { text-align: center; margin-bottom: 30px; }
        .login-title h1 { font-size: 24px; margin: 0 0 8px; color: #1e3c72; }
        .login-title p { margin: 0; color: #909399; font-size: 14px; }

        /* 布局 */
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: var(--sidebar-width); background: #001529; color: #fff;
            position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
            display: flex; flex-direction: column; transition: transform .3s;
        }
        .sidebar-logo { padding: 18px 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,.1); }
        .sidebar-logo i { color: #409eff; margin-right: 8px; }
        .sidebar-menu { flex: 1; overflow-y: auto; padding: 10px 0; }
        .menu-item {
            display: flex; align-items: center; gap: 10px; padding: 12px 20px; cursor: pointer;
            color: rgba(255,255,255,.7); transition: all .2s; border-left: 3px solid transparent;
        }
        .menu-item:hover { color: #fff; background: rgba(255,255,255,.08); }
        .menu-item.active { color: #fff; background: #1890ff; border-left-color: #fff; }
        .sidebar-user { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,.1); font-size: 13px; }

        .main { flex: 1; margin-left: var(--sidebar-width); min-height: 100vh; display: flex; flex-direction: column; }
        .topbar {
            height: 56px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08);
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 50;
        }
        .topbar-title { font-size: 16px; font-weight: 600; color: #333; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .content { padding: 20px; flex: 1; }

        .mobile-mask {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 90;
        }

        /* 统计卡片 */
        .view-banner {
            display: flex; align-items: center; flex-wrap: wrap; gap: 4px;
            background: #f7f9fc; border: 1px solid #ebeef5; border-radius: 8px;
            padding: 10px 14px; margin-bottom: 16px;
        }
        .stat-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 20px;
        }
        .org-card {
            background: #fff; border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px;
        }
        .org-title { font-size: 13px; color: #909399; margin-bottom: 8px; }
        .org-body { display: flex; flex-wrap: wrap; gap: 20px; }
        .org-item { display: inline-flex; align-items: center; gap: 8px; }
        .org-label { color: #c0c4cc; font-size: 13px; }
        .org-strong { font-weight: 600; color: #333; font-size: 14px; }
        .org-muted { color: #909399; font-size: 13px; }
        .stat-card {
            background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
        .stat-card .label { color: #909399; font-size: 13px; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #333; }
        .stat-card .sub { font-size: 12px; color: #c0c4cc; margin-top: 4px; }

        .chart-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
        }
        .chart-card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .chart-card .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #333; }
        .chart-box { height: 300px; }
        .chart-card.wide { grid-column: 1 / -1; }
        .chart-card.full { grid-column: 1 / -1; }

        .page-card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .page-card .card-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .page-card .card-body { padding: 20px; }

        .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .tag-lite { font-size: 12px; }

        .ticket-meta { color: #606266; font-size: 13px; }
        .ticket-meta .el-tag { margin-right: 6px; }

        .desc-cell { color: #606266; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* 表单 */
        .form-footer { display: flex; justify-content: flex-end; gap: 12px; }

        /* 评论 */
        .comment-item { padding: 12px 0; border-bottom: 1px dashed #ebedf0; }
        .comment-item:last-child { border-bottom: none; }
        .comment-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .comment-user { font-weight: 600; color: #1e3c72; font-size: 13px; }
        .comment-time { color: #c0c4cc; font-size: 12px; }
        .comment-content { color: #333; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }

        .attach-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .attach-item:last-child { border-bottom: none; }
        .attach-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .attach-meta { color: #c0c4cc; font-size: 12px; }

        /* 状态标记 */
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .mobile-mask.open { display: block; }
            .main { margin-left: 0; }
            .chart-grid { grid-template-columns: 1fr; }
            .content { padding: 12px; }
            .menu-toggle { display: inline-flex !important; }
        }
        .menu-toggle { display: none; }
        .el-menu-popper { display: none !important; }

        .mobile-menu-app .sidebar-menu-mobile { padding: 12px; }
    </style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.9.1/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2.3.1/dist/index.iife.min.js"></script>
<script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
<script src="app.js"></script>
<script src="login.js"></script>
<script src="main-layout.js"></script>
<script src="dashboard.js"></script>
<script src="ticket-list.js"></script>
<script src="user-manage.js"></script>
<script src="role-manage.js"></script>
<script src="log-manage.js"></script>
<script src="config-manage.js"></script>
<script src="main.js"></script>
</body>
</html>
